<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FOUNDRY // SIGNAL ORGANISM</title>
<meta name="description" content="An original industrial signal organism: a generative p5.js visual system driven locally by SuperCollider OSC or publicly in autonomous demo mode.">
<meta property="og:title" content="Foundry Signal Organism">
<meta property="og:description" content="A live industrial p5.js signal organism driven by SuperCollider OSC.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://zack-bolich.github.io/supercollider-foundry-av/assets/foundry-live-preview.png">
<meta property="og:url" content="https://zack-bolich.github.io/supercollider-foundry-av/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:,">
<script src="./p5.min.js"></script>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050607;color:#d7e0d8;font-family:Consolas,"Courier New",monospace}
  canvas{display:block}
  #boot{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;letter-spacing:.22em;font-size:12px;color:#d6ff45;background:#050607;transition:opacity .6s}
  #audioStart{position:fixed;z-index:20;left:50%;top:78%;transform:translate(-50%,-50%);padding:14px 22px;border:1px solid #d6ff45;background:rgba(5,6,7,.9);color:#d6ff45;font:700 12px Consolas,monospace;letter-spacing:.18em;cursor:pointer;box-shadow:0 0 24px rgba(214,255,69,.14)}
  #audioStart:hover{background:#d6ff45;color:#050607}
  #audioStart:disabled{opacity:.6;cursor:wait}
</style>
</head>
<body><div id="boot">INITIALIZING FOUNDRY LINK</div><button id="audioStart" type="button">START AUDIO</button>
<script>
p5.disableFriendlyErrors = true;
const PALETTE={void:'#050607',iron:'#19201d',bone:'#d7e0d8',acid:'#d6ff45',ember:'#ff5a24',cold:'#36d7ff',bruise:'#8c42ff'};
const LOCAL_PAGE=['127.0.0.1','localhost'].includes(location.hostname);
const STATIC_MODE=new URLSearchParams(location.search).has('static');
const EXPLICIT_WS=new URLSearchParams(location.search).get('ws');
const state={section:(LOCAL_PAGE&&!STATIC_MODE)?'FOUNDRY':'PUBLIC DEMO',sectionIndex:0,beat:0,connected:false,oscLive:false,lastOsc:0,received:0,demo:!LOCAL_PAGE||STATIC_MODE,audio:false,hud:true,kick:0,snare:0,hat:0,note:0,voice:0,shake:0,flash:0,pitch:48};
let sparks=[], shards=[], trails, seed=47011, socket, reconnectTimer, demoStep=0, demoLast=0;
let audioCtx,audioMaster,audioTimer,nextNoteTime=0,audioStep=0,noiseBuffer,voiceBuffer,audioScheduled=0,voicePlays=0;
const sectionNames=['FOUNDRY','CRUCIBLE','OVERLOAD','BLACKOUT'];

function setup(){
  pixelDensity(1); createCanvas(windowWidth,windowHeight); frameRate(60);
  colorMode(HSB,360,100,100,100); randomSeed(seed); noiseSeed(seed);
  trails=createGraphics(width,height); trails.pixelDensity(1); trails.colorMode(HSB,360,100,100,100); trails.clear();
  for(let i=0;i<80;i++) sparks.push(new Spark(random(width),random(height),random(-.3,.3),random(-.2,.2),random(20,180),false));
  connect(); document.getElementById('audioStart').addEventListener('click',initAudio); document.getElementById('boot').style.opacity='0'; setTimeout(()=>document.getElementById('boot').remove(),700);
  window.__AV_READY=true;
}

async function initAudio(){
  const btn=document.getElementById('audioStart');btn.disabled=true;btn.textContent='ARMING AUDIO';
  try{
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    const comp=audioCtx.createDynamicsCompressor();comp.threshold.value=-16;comp.knee.value=12;comp.ratio.value=7;comp.attack.value=.004;comp.release.value=.18;
    audioMaster=audioCtx.createGain();audioMaster.gain.value=.56;audioMaster.connect(comp).connect(audioCtx.destination);
    noiseBuffer=audioCtx.createBuffer(1,audioCtx.sampleRate*2,audioCtx.sampleRate);const d=noiseBuffer.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    await audioCtx.resume();
    playKick(audioCtx.currentTime+.02,.9);
    try{const raw=await fetch('./assets/german-machine-voice.mp3').then(r=>r.arrayBuffer());voiceBuffer=await audioCtx.decodeAudioData(raw)}catch(_){voiceBuffer=null}
    state.audio=true;state.demo=false;state.section='FOUNDRY';nextNoteTime=audioCtx.currentTime+.08;audioStep=0;scheduleAudio();audioTimer=setInterval(scheduleAudio,25);
    btn.remove();window.__AUDIO_STATUS={running:audioCtx.state==='running',scheduled:audioScheduled,voiceLoaded:!!voiceBuffer,contextTime:audioCtx.currentTime};
  }catch(error){btn.disabled=false;btn.textContent='RETRY AUDIO';console.error(error)}
}
function audioEnv(g,t,peak,attack,decay){g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,peak),t+attack);g.gain.exponentialRampToValueAtTime(.0001,t+attack+decay)}
function playKick(t,v){const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.setValueAtTime(132,t);o.frequency.exponentialRampToValueAtTime(41,t+.13);audioEnv(g,t,.72*v,.002,.31);o.connect(g).connect(audioMaster);o.start(t);o.stop(t+.36);audioScheduled++}
function noiseHit(t,v,hat=false){const src=audioCtx.createBufferSource(),f=audioCtx.createBiquadFilter(),g=audioCtx.createGain();src.buffer=noiseBuffer;f.type=hat?'highpass':'bandpass';f.frequency.value=hat?6900:1850;f.Q.value=hat?.7:.9;audioEnv(g,t,(hat?.10:.31)*v,.001,hat?.045:.17);src.connect(f).connect(g).connect(audioMaster);src.start(t);src.stop(t+(hat?.08:.24));audioScheduled++}
function playBass(t,midi,v){const f=440*Math.pow(2,(midi-69)/12),o1=audioCtx.createOscillator(),o2=audioCtx.createOscillator(),filter=audioCtx.createBiquadFilter(),g=audioCtx.createGain();o1.type='sawtooth';o2.type='square';o1.frequency.value=f;o2.frequency.value=f/2;filter.type='lowpass';filter.Q.value=8;filter.frequency.setValueAtTime(320,t);filter.frequency.exponentialRampToValueAtTime(1100+state.sectionIndex*90,t+.025);filter.frequency.exponentialRampToValueAtTime(190,t+.18);audioEnv(g,t,.17*v,.003,.19);o1.connect(filter);o2.connect(filter);filter.connect(g).connect(audioMaster);o1.start(t);o2.start(t);o1.stop(t+.23);o2.stop(t+.23);audioScheduled++}
function playMetal(t,v){const g=audioCtx.createGain(),f=audioCtx.createBiquadFilter();f.type='bandpass';f.frequency.value=1400+Math.random()*2400;f.Q.value=3;audioEnv(g,t,.08*v,.001,.22);[217,307,593].forEach((hz,i)=>{const o=audioCtx.createOscillator();o.type=i===1?'square':'sine';o.frequency.value=hz*(.9+Math.random()*.2);o.connect(f);o.start(t);o.stop(t+.27)});f.connect(g).connect(audioMaster);audioScheduled++}
function playRobotVoice(t){if(!voiceBuffer)return;const src=audioCtx.createBufferSource(),speech=audioCtx.createBiquadFilter(),carrier=audioCtx.createOscillator(),ring=audioCtx.createGain(),tone=audioCtx.createBiquadFilter(),dry=audioCtx.createGain();src.buffer=voiceBuffer;speech.type='bandpass';speech.frequency.value=1250;speech.Q.value=.55;carrier.type='sawtooth';carrier.frequency.value=[72,86,96][state.sectionIndex%3];ring.gain.value=0;tone.type='lowpass';tone.frequency.value=4200;dry.gain.value=.055;src.connect(speech);speech.connect(ring.gain);carrier.connect(ring).connect(tone).connect(audioMaster);speech.connect(dry).connect(audioMaster);src.start(t);carrier.start(t);src.onended=()=>{try{carrier.stop()}catch(_){}};audioScheduled++;voicePlays++;setTimeout(()=>hit('voice',1),Math.max(0,(t-audioCtx.currentTime)*1000))}
function visualAt(t,fn){setTimeout(fn,Math.max(0,(t-audioCtx.currentTime)*1000))}
function scheduleStep(step,t){
  const kick=[.82,.64,.76,.66,.85,.61,.78,0][Math.floor(step/2)%8],bass=[40,40,39,40,43,40,41,39,40,45,43,40,39,41,40,null][step%16];
  if(step%2===0&&kick>0){playKick(t,kick);visualAt(t,()=>hit('kick',kick))}
  if(step%8===4){noiseHit(t,.9,false);visualAt(t,()=>hit('snare',.82))}
  noiseHit(t,[.08,.15,.11,.23][step%4],true);visualAt(t,()=>hit('hat',[.08,.15,.11,.23][step%4]));
  if(bass!==null){playBass(t,bass,.9);visualAt(t,()=>{state.pitch=bass;state.note=.58;spawnNote(bass,.58)})}
  if(step%16===11&&Math.random()>.35)playMetal(t,.8);
  if(step%64===0)visualAt(t,()=>setSection(sectionNames[Math.floor(step/64)%4],Math.floor(step/64)));
  if(step%256===32)playRobotVoice(t);
  visualAt(t,()=>{state.beat=step%16;state.flash=Math.max(state.flash,.12)});
}
function scheduleAudio(){if(!audioCtx||audioCtx.state!=='running')return;const sixteenth=60/164/4;while(nextNoteTime<audioCtx.currentTime+.12){scheduleStep(audioStep,nextNoteTime);nextNoteTime+=sixteenth;audioStep++}window.__AUDIO_STATUS={running:true,scheduled:audioScheduled,step:audioStep,voiceLoaded:!!voiceBuffer,voicePlays,contextTime:audioCtx.currentTime}}

function connect(){
  clearTimeout(reconnectTimer);
  const target=EXPLICIT_WS||((LOCAL_PAGE&&!STATIC_MODE)?`ws://${location.host}`:null);
  if(!target)return;
  socket=new WebSocket(target);
  socket.onopen=()=>{state.connected=true};
  socket.onclose=()=>{state.connected=false;state.oscLive=false;reconnectTimer=setTimeout(connect,1000)};
  socket.onerror=()=>socket.close();
  socket.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.type==='osc')handleOSC(m);if(m.type==='relay'&&m.status==='connected')state.received=m.received||0}catch(_){}};
}

function handleOSC(m){
  state.oscLive=true;state.lastOsc=performance.now();state.received=m.received||state.received+1;
  const a=m.args||[];
  if(m.address==='/av/section') setSection(String(a[0]||'FOUNDRY'),Number(a[1]||0));
  if(m.address==='/av/beat'){state.beat=Number(a[0]||0);state.flash=Math.max(state.flash,.15+Number(a[1]||0)*.18)}
  if(m.address==='/av/hit') hit(String(a[0]||'hat'),Number(a[1]||.5));
  if(m.address==='/av/note'){state.pitch=Number(a[0]||48);state.note=Math.max(state.note,Number(a[1]||.5));spawnNote(state.pitch,state.note)}
  if(m.address==='/av/stop'){state.oscLive=false;state.section='HALTED'}
}
function setSection(name,index){state.section=String(name).toUpperCase();state.sectionIndex=Number(index)||0;state.flash=.7;for(let i=0;i<34;i++)spawnShard(width/2,height/2,random(TWO_PI),random(3,13))}
function hit(kind,v){v=Math.max(0,Math.min(1.5,v));if(kind==='kick'){state.kick=Math.max(state.kick,v);state.shake+=9*v;for(let i=0;i<18*v;i++)spawnSpark(width/2,height*.72,true)}else if(kind==='snare'){state.snare=Math.max(state.snare,v);state.flash=Math.max(state.flash,.5*v);for(let i=0;i<22*v;i++)spawnShard(width*.5,height*.46,random(TWO_PI),random(4,15))}else if(kind==='voice'){state.voice=1;state.flash=.35}else{state.hat=Math.max(state.hat,v);for(let i=0;i<5*v;i++)spawnSpark(random(width),height*.18,true)}}
function spawnNote(note,v){const y=map(note,30,90,height*.82,height*.14,true);for(let i=0;i<10+v*15;i++)sparks.push(new Spark(width*.5+random(-width*.12,width*.12),y,random(-3,3),random(-2,2),random(45,110),true))}
function spawnSpark(x,y,burst=false){sparks.push(new Spark(x,y,burst?random(-5,5):random(-.3,.3),burst?random(-7,-1):random(-.2,.2),random(35,130),burst))}
function spawnShard(x,y,a,s){shards.push({x,y,vx:cos(a)*s,vy:sin(a)*s,life:1,spin:random(-.25,.25),r:random(3,16)})}

function draw(){
  if(performance.now()-state.lastOsc>1800)state.oscLive=false;
  if(state.demo&&!state.audio)runDemo();
  decayState();
  const sx=random(-state.shake,state.shake),sy=random(-state.shake,state.shake);
  push();translate(sx,sy);renderBackdrop();renderArchitecture();renderTrails();renderCore();renderParticles();renderGlitches();pop();
  if(state.hud)renderHUD();
  window.__AV_FRAME=frameCount;window.__AV_STATUS={...state,sparks:sparks.length,shards:shards.length};
}
function decayState(){state.kick*=.84;state.snare*=.79;state.hat*=.68;state.note*=.92;state.voice*=.965;state.shake*=.72;state.flash*=.78}

function renderBackdrop(){
  noStroke();
  for(let y=0;y<height;y+=8){const t=y/height;fill(160+15*t,18,4+7*t);rect(-20,y,width+40,9)}
  blendMode(ADD);for(let i=0;i<7;i++){const y=height*(.12+i*.13)+sin(frameCount*.006+i)*18;fill(i%2?82:20,85,8,10);rect(0,y,width,1+state.hat*2)}blendMode(BLEND);
  stroke(80,18,24,20);strokeWeight(1);for(let x=0;x<width;x+=32)line(x,0,x,height);for(let y=0;y<height;y+=32)line(0,y,width,y);
}
function renderArchitecture(){
  const cx=width/2,hz=height*.58;stroke(75,28,55,52);strokeWeight(1.2);noFill();
  for(let i=0;i<18;i++){const t=i/17,yy=lerp(hz,height*1.08,t*t);line(cx-width*(.08+t*.68),yy,cx+width*(.08+t*.68),yy)}
  for(let i=-8;i<=8;i++){const bx=cx+i*width*.075;line(cx+i*11,hz,bx,height)}
  noStroke();fill(20,70,24,45+state.kick*35);quad(0,height*.75,width*.31,hz,width*.39,hz,0,height);fill(190,60,22,35+state.snare*40);quad(width,height*.75,width*.69,hz,width*.61,hz,width,height);
  stroke(15,82,83,45);strokeWeight(2);for(let i=0;i<6;i++){const x=width*(.08+i*.17);line(x,height*.12,x,height*.32+sin(frameCount*.01+i)*28);line(x-13,height*.32,x+13,height*.32)}
}
function renderTrails(){
  trails.noStroke();trails.fill(160,30,2.2,12);trails.rect(0,0,width,height);
  trails.blendMode(ADD);trails.strokeWeight(1);
  for(let p of sparks){if(p.life>.2){trails.stroke(p.hue,85,85,p.life*18);trails.line(p.x,p.y,p.x-p.vx*3,p.y-p.vy*3)}}
  trails.blendMode(BLEND);image(trails,0,0);
}
function renderCore(){
  const cx=width/2,cy=height*.40,base=Math.min(width,height)*(.125+state.kick*.012);
  drawAnvil(cx,cy+base*1.30,base);
  push();translate(cx,cy);rotate(frameCount*.008*(state.section==='OVERLOAD'?2.4:1));
  stroke(82,78,92,78);strokeWeight(2.5);fill(155,18,18,96);
  beginShape();const teeth=18;
  for(let i=0;i<teeth*4;i++){const a=TWO_PI*i/(teeth*4),phase=i%4,r=base*(phase===1||phase===2?1.18:1.0);vertex(cos(a)*r,sin(a)*r)}
  endShape(CLOSE);
  fill(160,12,6,100);stroke(15,65,75,72);circle(0,0,base*1.42);
  stroke(82,80,92,72);strokeWeight(base*.10);for(let i=0;i<8;i++){const a=TWO_PI*i/8;line(cos(a)*base*.28,sin(a)*base*.28,cos(a)*base*.68,sin(a)*base*.68)}
  noStroke();fill(0,0,3,100);circle(0,0,base*.48);fill(82,88,95,65+state.kick*30);circle(0,0,base*.22);
  pop();
  drawHammer(cx-base*1.95,cy-base*.72,1,state.kick,base);
  drawHammer(cx+base*1.95,cy-base*.72,-1,state.snare,base);
  noFill();stroke(15,88,95,45+state.snare*40);strokeWeight(2);arc(cx,cy,base*3.15,base*3.15,PI+.22,TWO_PI-.22);
  if(state.voice>.02){stroke(190,85,95,state.voice*70);for(let i=0;i<4;i++){const rr=base*(1.75+i*.17);arc(cx,cy,rr*2,rr*2,-1.05,1.05)}}
  noStroke();fill(82,65,88,70);textAlign(CENTER);textSize(10);text('FORGE DRIVE // HAMMER ARRAY',cx,cy+base*2.18);textAlign(LEFT);
}
function drawHammer(x,y,side,impact,b){
  push();translate(x,y);scale(side,1);rotate(.34+impact*.46);const len=b*1.55;
  noStroke();fill(155,16,28,100);rect(-b*.30,-b*.25,b*.72,b*.50,4);fill(15,70,70,65);rect(-b*.23,-b*.18,b*.58,b*.09,2);
  stroke(25,65,45,90);strokeWeight(2);fill(28,48,27,100);rect(b*.18,-b*.055,len,b*.11,3);
  pop();
}
function drawAnvil(x,y,b){
  push();translate(x,y);stroke(155,20,52,90);strokeWeight(2);fill(158,18,16,100);
  beginShape();vertex(-b*.95,-b*.25);vertex(b*.78,-b*.25);vertex(b*1.08,-b*.08);vertex(b*.62,b*.03);vertex(b*.34,b*.28);vertex(b*.27,b*.62);vertex(b*.58,b*.78);vertex(-b*.58,b*.78);vertex(-b*.28,b*.62);vertex(-b*.34,b*.27);vertex(-b*.62,b*.02);endShape(CLOSE);
  fill(15,78,75,55+state.kick*35);noStroke();rect(-b*.78,-b*.25,b*1.55,b*.07);pop();
}
function renderParticles(){
  blendMode(ADD);noStroke();
  for(let i=sparks.length-1;i>=0;i--){const p=sparks[i];p.update();p.draw();if(p.life<=0)sparks.splice(i,1)}
  blendMode(BLEND);fill(15,90,90);noStroke();
  for(let i=shards.length-1;i>=0;i--){const q=shards[i];q.x+=q.vx;q.y+=q.vy;q.vx*=.98;q.vy=q.vy*.98+.08;q.life-=.018;push();translate(q.x,q.y);rotate(frameCount*q.spin);fill(15+state.sectionIndex*35,90,95,q.life*80);rect(-q.r/2,-1,q.r,2);pop();if(q.life<=0)shards.splice(i,1)}
  if(sparks.length>900)sparks.splice(0,sparks.length-900);
}
function renderGlitches(){
  if(state.snare>.12||state.section==='OVERLOAD'){noStroke();const n=2+floor(state.snare*10);for(let i=0;i<n;i++){const y=random(height),h=random(1,8),off=random(-40,40)*state.snare;fill(random()<.5?82:190,90,90,8+state.snare*18);rect(off,y,width,h)}}
  noStroke();fill(0,0,100,state.flash*7);rect(0,0,width,height);
  stroke(0,0,100,4);for(let y=0;y<height;y+=4)line(0,y,width,y);
}
function renderHUD(){
  const live=state.connected&&state.oscLive, signal=live?'OSC LIVE':(state.audio?'BROWSER AUDIO':((LOCAL_PAGE&&!STATIC_MODE)?'OSC WAITING':'PUBLIC AUTONOMOUS'));noStroke();fill(0,0,2,72);rect(18,18,292,102);stroke(live?82:15,88,90,70);noFill();rect(18.5,18.5,292,102);noStroke();
  fill(live?82:15,85,95);textSize(11);textStyle(BOLD);text(`● ${signal}  //  ${state.demo?'DEMO':'REAL SIGNAL'}`,32,43);
  fill(0,0,88);textSize(22);text(state.section,31,72);textStyle(NORMAL);fill(160,15,65);textSize(10);text(`PORT 57220   EVENTS ${nf(state.received,6)}   BEAT ${nf(state.beat,2)}`,32,97);
  textAlign(RIGHT);fill(0,0,70);text('FOUNDRY SIGNAL ORGANISM  /  F FULLSCREEN  H HUD  D DEMO',width-24,height-22);textAlign(LEFT);
  if(state.voice>.03){fill(190,70,95,state.voice*75);textAlign(CENTER);textSize(12);text('MASCHINENSTIMME // KANAL OFFEN',width/2,height*.82);textAlign(LEFT)}
}
function runDemo(){if(millis()-demoLast>91){demoLast=millis();demoStep++;if(demoStep%2===0)hit('kick',.75);if(demoStep%8===4)hit('snare',.8);hit('hat',random(.08,.35));if(demoStep%3===0){state.note=.5;spawnNote(40+(demoStep%18),.5)}if(demoStep%64===0)setSection(sectionNames[(demoStep/64)%4|0],demoStep/64|0)}}

class Spark{
  constructor(x,y,vx,vy,life,burst){this.x=x;this.y=y;this.vx=vx;this.vy=vy;this.max=life;this.life=life/120;this.hue=random()<.72?random(65,92):random(10,25);this.size=burst?random(1,3.8):random(.5,1.8)}
  update(){const a=noise(this.x*.003,this.y*.003,frameCount*.004)*TWO_PI*2;this.vx+=cos(a)*.018;this.vy+=sin(a)*.018;this.x+=this.vx;this.y+=this.vy;this.vx*=.992;this.vy*=.992;this.life-=.006;if(this.x<0)this.x=width;if(this.x>width)this.x=0;if(this.y<0)this.y=height;if(this.y>height)this.y=0}
  draw(){fill(this.hue,88,96,Math.max(0,this.life)*85);circle(this.x,this.y,this.size*(1+state.hat*1.7))}
}
function keyPressed(){if(key==='f'||key==='F')fullscreen(!fullscreen());if(key==='s'||key==='S')saveCanvas('foundry-signal-organism','png');if(key==='d'||key==='D')state.demo=!state.demo;if(key==='h'||key==='H')state.hud=!state.hud}
function mousePressed(){for(let i=0;i<34;i++)spawnShard(mouseX,mouseY,random(TWO_PI),random(2,12));state.snare=.8}
function windowResized(){resizeCanvas(windowWidth,windowHeight);trails=createGraphics(width,height);trails.pixelDensity(1);trails.colorMode(HSB,360,100,100,100);trails.clear()}
</script></body></html>
