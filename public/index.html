function buildArena(){

function makeGear(r,teeth,color){const g=new THREE.Group(),mat=new THREE.MeshStandardMaterial({color,metalness:.92,roughness:.35,emissive:0x190400});const ring=new THREE.Mesh(new THREE.TorusGeometry(r,.22,8,teeth*2),mat);g.add(ring);for(let i=0;i<teeth;i++){const t=new THREE.Mesh(new THREE.BoxGeometry(.25,.42,.28),mat);const a=i*Math.PI*2/teeth;t.position.set(Math.cos(a)*r,Math.sin(a)*r,0);t.rotation.z=a;g.add(t)}for(let i=0;i<8;i++){const s=new THREE.Mesh(new THREE.BoxGeometry(r*1.45,.11,.13),mat);s.rotation.z=i*Math.PI/4;g.add(s)}return g}

function buildParticles(){const n=700,geo=new THREE.BufferGeometry(),pos=new Float32Array(n*3),col=new Float32Array(n*3);for(let i=0;i<n;i++){particleData.push({life:0,v:new THREE.Vector3()});pos[i*3+1]=-99;col.set([1,.2,.02],i*3)}geo.setAttribute('position',new THREE.BufferAttribute(pos,3));geo.setAttribute('color',new THREE.BufferAttribute(col,3));particles=new THREE.Points(geo,new THREE.PointsMaterial({size:.13,vertexColors:true,transparent:true,opacity:.95,blending:THREE.AdditiveBlending,depthWrite:false}));scene.add(particles);

function updateBattle(dt,now){const a=attackEnvelope(attackA,now),b=attackEnvelope(attackB,now),av=clamp(a.v),bv=clamp(b.v);state.butcherAttack=a.v;state.ripperAttack=b.v;

function hit(kind,v=.8){v=clamp(v,0,1.5);const now=performance.now();if(kind==='kick'){state.kick=Math.max(state.kick,v);if(now-attackA>920){attackA=now;state.shake+=.05*v}}else if(kind==='snare'){state.snare=Math.max(state.snare,v);if(now-attackB>920)attackB=now}else if(kind==='voice'){state.voice=1;state.flash=.35}else state.hat=Math.max(state.hat,v)}

async function initAudio(){const btn=$('audioStart');btn.disabled=true;btn.textContent='ARMING MACHINE WAR';try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();const comp=audioCtx.createDynamicsCompressor();comp.threshold.value=-16;comp.knee.value=12;comp.ratio.value=7;comp.attack.value=.004;comp.release.value=.18;audioMaster=audioCtx.createGain();audioMaster.gain.value=.56;audioMaster.connect(comp).connect(audioCtx.destination);noiseBuffer=audioCtx.createBuffer(1,audioCtx.sampleRate*2,audioCtx.sampleRate);const d=noiseBuffer.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;await audioCtx.resume();playKick(audioCtx.currentTime+.02,.9);try{const raw=await fetch('./assets/german-machine-voice.mp3').then(r=>r.arrayBuffer());voiceBuffer=await audioCtx.decodeAudioData(raw)}catch(_){voiceBuffer=null}state.audio=true;state.demo=false;state.section='FOUNDRY';nextNoteTime=audioCtx.currentTime+.08;audioStep=0;scheduleAudio();audioTimer=setInterval(scheduleAudio,25);btn.remove()}catch(error){btn.disabled=false;btn.textContent='RETRY AUDIO';console.error(error)}}
function env(g,t,peak,a,d){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,peak),t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d)}
function playKick(t,v){const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.setValueAtTime(132,t);o.frequency.exponentialRampToValueAtTime(41,t+.13);env(g,t,.72*v,.002,.31);o.connect(g).connect(audioMaster);o.start(t);o.stop(t+.36);audioScheduled++}
function noiseHit(t,v,hat=false){const s=audioCtx.createBufferSource(),f=audioCtx.createBiquadFilter(),g=audioCtx.createGain();s.buffer=noiseBuffer;f.type=hat?'highpass':'bandpass';f.frequency.value=hat?6900:1850;f.Q.value=.8;env(g,t,(hat?.10:.31)*v,.001,hat?.045:.17);s.connect(f).connect(g).connect(audioMaster);s.start(t);s.stop(t+(hat?.08:.24));audioScheduled++}
function playBass(t,midi,v){const hz=440*2**((midi-69)/12),o=audioCtx.createOscillator(),f=audioCtx.createBiquadFilter(),g=audioCtx.createGain();o.type='sawtooth';o.frequency.value=hz;f.type='lowpass';f.Q.value=9;f.frequency.setValueAtTime(1050,t);f.frequency.exponentialRampToValueAtTime(170,t+.19);env(g,t,.2*v,.003,.2);o.connect(f).connect(g).connect(audioMaster);o.start(t);o.stop(t+.24);audioScheduled++}
function playMetal(t,v){const g=audioCtx.createGain(),f=audioCtx.createBiquadFilter();f.type='bandpass';f.frequency.value=1600+Math.random()*2200;f.Q.value=3;env(g,t,.09*v,.001,.24);[217,307,593].forEach((hz,i)=>{const o=audioCtx.createOscillator();o.type=i===1?'square':'sine';o.frequency.value=hz*(.9+Math.random()*.2);o.connect(f);o.start(t);o.stop(t+.28)});f.connect(g).connect(audioMaster);audioScheduled++}
function playVoice(t){if(!voiceBuffer)return;const src=audioCtx.createBufferSource(),filter=audioCtx.createBiquadFilter(),g=audioCtx.createGain();src.buffer=voiceBuffer;filter.type='bandpass';filter.frequency.value=1050;filter.Q.value=.7;g.gain.value=.16;src.connect(filter).connect(g).connect(audioMaster);src.start(t);audioScheduled++;voicePlays++;visualAt(t,()=>hit('voice',1))}
function visualAt(t,fn){setTimeout(fn,Math.max(0,(t-audioCtx.currentTime)*1000))}
function stepAudio(step,t){const kick=[.86,.66,.78,.64,.9,.62,.8,0][Math.floor(step/2)%8],bass=[40,40,39,40,43,40,41,39,40,45,43,40,39,41,40,null][step%16];if(step%2===0&&kick){playKick(t,kick);visualAt(t,()=>hit('kick',kick))}if(step%8===4){noiseHit(t,.9);visualAt(t,()=>hit('snare',.86))}noiseHit(t,[.08,.15,.11,.23][step%4],true);if(bass!==null){playBass(t,bass,.9);visualAt(t,()=>{state.pitch=bass;state.note=.58})}if(step%16===11)playMetal(t,.8);if(step%64===0)visualAt(t,()=>setSection(sections[Math.floor(step/64)%4],Math.floor(step/64)));if(step%256===32)playVoice(t);visualAt(t,()=>state.beat=step%16)}
function scheduleAudio(){if(!audioCtx||audioCtx.state!=='running')return;const sixteenth=60/164/4;while(nextNoteTime<audioCtx.currentTime+.12){stepAudio(audioStep,nextNoteTime);nextNoteTime+=sixteenth;audioStep++}window.__AUDIO_STATUS={running:true,scheduled:audioScheduled,step:audioStep,voiceLoaded:!!voiceBuffer,voicePlays,contextTime:audioCtx.currentTime}}
</script></body></html>
